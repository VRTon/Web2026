url: "https://vrton.org"
baseurl: ""
safe: false
lang: "es"
languages: ["es", "en"]
default_lang: "es"
parallel_localization: false
exclude_from_localization:
  - _site
  - es/
  - terms/
  - code-of-conduct/
  - volunteering/
  - discord.html
  - site.webmanifest
  - robots.txt
  - sitemap.xml
  - styles.css
  - script.js
  - styles.scss
  - assets
  - favicon
  - android-chrome
  - apple-touch-icon.png

title: "VRTon"
tagline: "Using Technology to Change Lives"
description: "VRTon is a voluntary initiative bringing together VR communities to achieve charitable goals through virtual reality events."
logo: "/assets/logo.webp"

author:
  name: "VRTon"

social:
  name: "VRTon"
  links:
    - "https://discord.gg/AR72D2nfpp"
    - "https://www.instagram.com/vrtonof/"
    - "https://x.com/vrtonof"
    - "https://www.tiktok.com/@vrtonoficial"
    - "https://www.youtube.com/@VRTonOficial"
    - "https://www.twitch.tv/vrtonof"

twitter:
  username: "vrtonof"
  card: summary_large_image

plugins:
  - jekyll-polyglot
  - jekyll-sitemap
  - jekyll-minifier

jekyll-minifier:
  exclude:
    - robots.txt
    - sitemap.xml
  compress_css: false
  compress_javascript: true
  compress_html: true
  remove_comments: true

permalink: pretty

sass:
  style: compressed
  sourcemap: never

exclude:
  - _site/
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - .dockerignore
  - node_modules/
  - vendor/
  - .bundle
  - .github/
  - VRTon Web/
  - Docs/
  - graphify-out/
  - AGENTS.md
  - README.md
  - assets/README.md
  - assets/2026/Manual de Marca/
  - assets/2026/Posters/
  - scripts/
  - workers/

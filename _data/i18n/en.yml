  faq:
    title: "Frequently Asked Questions"
    left:
      - question: "What is VRTon?"
        answer_html: "VRTon is a voluntary initiative that brings together communities from the virtual reality metaverse to achieve solidarity goals. We focus on education, inspiration, empathy, and philanthropy while using technology to help others and improve lives."
      - question: "How can I attend an event?"
        answer_html: "This year's event will be held on the <b>6th and 7th of November</b>. You can attend by joining our <a href='https://vrc.group/VRTON.0659'>VRChat Group</a>. The event is completely free."
      - question: "Do I need VR equipment to participate?"
        answer_html: "No! While VR headsets provide the most immersive experience, you can join our events using a computer or even your phone!"
      - question: "How can I volunteer?"
        answer_html: "We're always looking for passionate individuals to join our team! Click <a href='VOLUNTEERING_URL'>here</a> to learn more about the volunteer opportunities available."
    right:
      - question: "Where does the money go?"
        answer_html: "100% of the funds raised go directly to our partner charities and causes. We promote donating using the official links provided by the organizations and don't collect money ourselves."
      - question: "What kind of activities can we expect on VRTon?"
        answer_html: "You can expect a variety of activities on VRTon catering to different interests and age groups, including live concerts and shows, educational workshops, awareness campaigns, and community gatherings."
      - question: "How can I stay updated on upcoming events?"
        answer_html: "Follow us on our social media channels (Discord, Instagram, X, TikTok, YouTube, and Twitch) for the latest news, event announcements, and behind-the-scenes content."

legal:
  terms:
    title: "VRTon 2026 Terms and Conditions"
    subtitle: "Event Rules and Policies"
    sections:
      scope:
        title: "VRTon 2026 Terms and Conditions"
        subtitle: "1. Scope"
        content: "These Terms and Conditions apply to the use of all spaces and activities related to VRTon, including the main event, Discord server, VRChat group, official website, and social media. They apply before, during, and after the event."
      compliance:
        title: "2. Compliance with External Standards"
        intro: "All participants must respect the Terms of Service and Community Guidelines of the platforms used:"
        vrchat_tos: "Terms of Service"
        vrchat_guidelines: "Community Guidelines"
        discord_tos: "Terms of Service"
        discord_guidelines: "Community Guidelines"
      access:
        title: "3. Access and Eligibility"
        age: "Access to the event is restricted to people over 18 years of age, except in cases expressly pre-approved by the management team and with authorization from a legal guardian."
        free: "Entry to the event is free."
        geographic: "There are no geographical restrictions to participate."
        vr: "Access to the event in VRChat does not require a virtual reality headset, although the platform may impose its own technical or access restrictions."
      intellectual:
        title: "4. Intellectual Property and Volunteering"
        ownership: "All official VRTon material (logos, designs, texts, worlds, assets, presentations, graphics, etc.) is the exclusive property of VRTon and cannot be used without express authorization."
        volunteer: "Virtual volunteer positions at VRTon are free participation and have no economic compensation. Those who wish to join these activities can do so according to their availability and will. Other paid work roles, if they exist, will be governed by specific contracts and conditions agreed upon by the organization."
        resources: "All resources created for VRTon can be used without restriction in current and future events, even if the original creator leaves the team."
      enforcement:
        title: "5. Rule Enforcement and Sanctions"
        discretion: "The determination of what content falls into the category of suitable or unsuitable for events is solely at the discretion of the VRTon moderation team."
        immediate: "The moderation team can act immediately in case of non-compliance."
        explanation: "VRTon is not obligated to provide explanations about applied sanctions."
      liability:
        title: "6. Limitation of Liability"
        technical: "VRTon is not responsible for technical problems, server crashes, VRChat or Discord interruptions, or software or hardware failures of participants."
        conduct: "VRTon is not responsible for user conduct within or outside official spaces."
        asis: "All content and services are delivered \"as is\", without guarantee of operation or future support."
        acceptance: "Participation implies acceptance of these conditions and moderation decisions."
        donations: "All VRTon 2026 donations are made through official donation channels provided by the choosen charity. VRTon is not responsible for any transaction made through unofficial means."
  code_of_conduct:
    title: "VRTon 2026 Code of Conduct"
    subtitle: "Event Rules and Standards"
    sections:
      introduction:
        title: "VRTon Code of Conduct"
        content: "The VRTon Code of Conduct seeks to ensure a safe, inclusive and respectful environment in all our instances (VRChat, Discord, web and social media)."
        moderation: "While rules and examples of prohibited behaviors are detailed, the final determination of what content or conduct is considered appropriate or inappropriate corresponds solely to the VRTon moderation and administration team."
        scope: "The following rules apply to both actions and conduct as well as content shared in any form: avatars, profile pictures, banners, emojis, stickers, items, sounds, animations or any other digital resource."
        compliance: "Likewise, all participants must comply with VRTon's Terms and Conditions, in addition to the Terms of Service and Standards of the platforms used."
      content_restrictions:
        title: "1. Content Restrictions"
        sexual_title: "1.1 Sexual or explicit content"
        sexual_avatars: "Nude avatars, with visible genitals or excessively revealing clothing."
        sexual_erp: "ERP, gestures, conversations or sexual or suggestive conduct."
        sexual_media: "Profile pictures, banners, stickers or emojis with NSFW content."
        disturbing_title: "1.2 Disturbing content"
        disturbing_gore: "Gore, graphic violence or extreme terror."
        disturbing_self_harm: "Apology for suicide or self-harm."
        disruptive_title: "1.3 Disruptive or troll content"
        disruptive_avatars: "Avatars with excessive sounds, invasive particles or shaders that hinder the experience of others."
        disruptive_behavior: "Attitudes intended to annoy, interrupt or sabotage activities."
        harmful_title: "1.4 Harmful speech"
        harmful_hate: "Expressions of hate, racism, xenophobia, homophobia, transphobia, sexism or any form of discrimination."
        harmful_politics: "Political or religious conversations."
        harmful_attacks: "Comments that seek to dismiss or attack VRTon, the selected charity, associated communities or participants."
      prohibited_actions:
        title: "2. Prohibited Actions"
        intro: "In addition to content, the following behaviors are prohibited in all VRTon spaces:"
        spam_title: "2.1 Spam and unauthorized advertising"
        spam_commercial: "Sending links to purchase/sale pages, contests, fundraising or similar without staff approval."
        spam_invites: "Sharing invitations to other Discord servers, social networks or external communities without authorization."
        spam_portals: "Opening \"portals\" to other instances in VRChat for the purpose of diverting users."
        spam_events: "Spam invitations to groups, events or instances outside of VRTon."
        impersonation_title: "2.2 Identity impersonation"
        impersonation_users: "Impersonating other users or organizations."
        impersonation_staff: "Pretending to be part of VRTon staff or virtual volunteers."
        information_title: "2.3 Information disclosure"
        information_personal: "Sharing personal information (own or others') without consent."
        information_false: "Spreading false information, rumors or misinformation with intent to harm."
        illegal_title: "2.4 Illegal activities"
        illegal_fraud: "Scams, deceptions or fraud attempts."
        illegal_piracy: "Distribution or promotion of illegally obtained content (\"ripping\" of assets, avatars, worlds or other resources)."
        illegal_other: "Any other illegal activity that violates local or international laws."
        harassment_title: "2.5 Harassment or violent conduct"
        harassment_general: "Harassment, threats, harassment or persecution towards any person."
        harassment_intimidation: "Verbal, gestural or avatar/animation intimidation."
        disruption_title: "2.6 Activity disruption"
        disruption_events: "Deliberately bothering during presentations, shows, talks or community activities."
        disruption_audio: "Screaming, voice spam, repetitive or invasive sounds."
        disruption_avatars: "Use of offensive, annoying avatars or with effects intended to disrupt."
        disruption_exploits: "Use of modified clients or other resources intended to exploit event systems for personal gain or disruption of others' experience."
  volunteering:
    title: "VRTon 2026 Volunteering and Collaboration Terms"
    subtitle: "Learn the conditions to be part of the VRTon team"
    sections:
      intro:
        title: "VRTon Volunteering Terms"
        content: "The objective of these terms is to establish a clear and transparent framework for those who wish to collaborate, either individually or representing communities."
      general:
        title: "1. General Provisions"
        nature_title: "1.1. Nature of Volunteering"
        nature_content1: "All positions at VRTon are voluntary and do not involve financial compensation."
        nature_content2: "Participation is free, and each individual or community may collaborate to the extent of their abilities and availability."
        recognition_title: "1.2. Recognition and Limitations"
        recognition_content1: "Credits will be awarded to every person or community that contributes, regardless of the magnitude."
        recognition_content2: "The status of volunteer or community collaborator cannot be used for self-promotion or for external projects unrelated to VRTon."
        ownership_title: "1.3. Ownership of Created Resources"
        ownership_content: "All resources created for VRTon (including assets, worlds, graphics, commissions, presentations, or others) can be used without restriction in current and future events, even if the creator or the responsible community ceases to be part of the project."
        communication_title: "1.4. Official Communication"
        communication_content1: "The VRTon Discord server will be the main communication medium."
        communication_content2: "Volunteers are expected to frequently review the assigned channels to stay informed about updates, tasks, and responsibilities."
        sanctions_title: "1.5. Sanctions"
        sanctions_content: "VRTon reserves the right to remove users or communities that remain inactive or fail to comply with these terms, the Code of Conduct, or the VRTon Terms and Conditions."
      individual:
        title: "2. Individual Volunteering"
        teams_title: "2.1. Work Teams"
        teams_content1: "Individual volunteering integrates directly into VRTon's official work teams, which can be consulted on the collaborators page: vrton.org/colaboradores."
        teams_content2: "Each volunteer may join the team that best suits their skills and interests, in coordination with the organization."
        teams_content3: "Each volunteer will be encouraged to participate in a maximum of two work teams simultaneously, although exceptions may be made in justified cases."
        commitment_title: "2.2. Expected Commitment"
        commitment_content1: "Fulfill the responsibilities assumed to the best of their abilities."
        commitment_content2: "Maintain open and respectful communication with work teams."
        commitment_content3: "Notify through the corresponding channels if absent or unable to meet set deadlines."
        leadership_title: "2.3. Leadership Structure"
        leadership_content1: "Each team will have a leader designated directly by VRTon's management team, who will be the main point of contact for any situation."
        leadership_content2: "If the problem involves the leader themselves, volunteers must contact VRTon's management team directly."
        leadership_content3: "Each person may lead only one team at a time, without exceptions."
      community:
        title: "3. Community Volunteering"
        modalities_title: "3.1. Participation Modalities"
        modalities_intro: "Communities wishing to collaborate with VRTon can do so through:"
        modalities_activities: "Activity Organization: Coordinate and carry out an activity within the main event."
        modalities_donations: "Collections and Donations: Organize internal fundraisers and present the group donation during the event."
        modalities_creative: "Creative Contributions: Donate assets, commissions, or other items for the Solidarity Raffle or related activities."
        modalities_outreach: "Outreach: Help publicize VRTon and connect with more users and communities."
        modalities_other: "Other Initiatives: Propose alternative forms of collaboration not covered by these terms, subject to approval by the VRTon team."
        responsibilities_title: "3.2. Responsibilities of Volunteer Communities"
        responsibilities_content1: "Designate at least one official representative to maintain communication with VRTon staff."
        responsibilities_content2: "Fulfill deadlines and requirements for proposed activities or contributions."
        responsibilities_content3: "Ensure that their contributions comply with the Terms and Conditions, Code of Conduct, and applicable laws."


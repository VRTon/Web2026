donate_page:
  eyebrow: "Donations"
  title: "How to donate"
  intro: "Support Teletón Chile through its official channels and send your receipt to add your contribution to the VRTon community total."
  period_label: "When to donate"
  period_title: "Donation period"
  opens: "Opens"
  closes: "Closes"
  to_confirm: "To be confirmed"
  local_time: "Times shown in your local time zone."
  period_pending: "The donation period is yet to be confirmed. The dates and access to the official portal will be published here."
  before: "Donations are not open yet. Time until opening:"
  open: "The donation period is open. Make your contribution directly through the official portal."
  closed: "The donation period has closed. No more donations are being accepted for this edition of VRTon."
  closed_receipts: "If you still have receipts to submit, send them through our Discord so we can count your contributions."
  official_link: "Donate through the official portal"
  no_script: "Enable JavaScript to see current availability and the countdown. You can also contact the team through Discord."
  safety_label: "Official channels only"
  safety_title: "Your donation goes straight to Teletón"
  no_money: "VRTon does not receive, collect or manage donation funds."
  official_only: "Donate only through Teletón Chile's official channels. Do not transfer money to team members or personal accounts claiming to represent VRTon."
  discord_help: "Get help on Discord"
  steps_label: "Step by step"
  steps_title: "Make your contribution count"
  steps_intro: "Read these steps before donating and keep your receipt."
  steps:
    - title: "Follow the official link"
      text: "During the donation period, use the button on this page to access Banco de Chile's official donation portal for Teletón."
    - title: "Complete your donation"
      text: "If you are donating from outside Chile, select “aporte desde el extranjero” (donate from abroad) and fill in the requested details. Check that your card supports international payments in US dollars."
    - title: "Send your receipt"
      text: "Take a photo or screenshot of your receipt, redact your personal information and send it to the “Donaciones” channel on our Discord to add your contribution to VRTon's total."
  privacy_title: "Redact your details before sharing"
  privacy_text: "Hide your full name, RUT or identity document, email, address, account or card numbers and any other personal information. Never share passwords or security codes."
  keep_visible: "Leave the amount, currency, date and donation confirmation visible so the team can count your contribution."
  send_receipt: "Send your receipt on Discord"
  accounting_label: "How donations are counted"
  accounting_title: "A community total"
  accounting_text: "VRTon adds up the amounts on receipts submitted to the “Donaciones” Discord channel to track the community's total contributions. Donating through the official portal does not automatically add your contribution to VRTon's count: remember to submit your receipt once."
  accounting_limit: "This count is based on the receipts received. It is not a bank certification of settled funds and does not mean that money passes through VRTon. If you donated during the donation period and still need to submit your receipt, you can do so on Discord even after the period closes."


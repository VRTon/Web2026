      text: "VRTon is a volunteer-driven initiative that brings together people and communities from different parts of the world around a shared passion: technology, virtual reality, and its ability to connect people.<br><br>We use virtual reality, primarily through VRChat, as a space to promote solidarity, educate and raise awareness about different realities, strengthen connections between communities, and raise funds to create a positive and tangible impact."
      image: "/assets/Eventos/2025/event-2025-1.webp"
      image_alt: "Group photo of VRTon 2025 participants in VRChat"
    - title: "In support of Teletón Chile"
      text: "For the fourth consecutive year, VRTon supports <b>Teletón Chile</b>, a nonprofit institution that provides free comprehensive rehabilitation to children and young people with motor disabilities and promotes their social inclusion. Donations are made only through Teletón's official channels."
      image: "/assets/Eventos/2024/event-2024-2.webp"
      image_alt: "Community activity during VRTon 2024"
      cta_label: "Learn more about Teletón"
      cta_url: "https://www.teleton.cl/"
    - title: "24+ hours of love"
      text: "This <b>November 6 and 7</b>, you’ll be able to enjoy a wide variety of live activities, shows, and workshops. Activities will be split between two instances: the main instance and the party instance. The event is completely free and open to everyone. <b>You do not need a virtual reality headset to join</b>; you can access it from your computer or phone."
      image: "/assets/Eventos/2025/event-2025-2.webp"
      image_alt: "Participants gathered during VRTon 2025"

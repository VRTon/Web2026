  events:
    title: "Eventos Anteriores"
    goal_reached: "Meta Alcanzada"
  faq:
    title: "Preguntas Frecuentes"
    left:
      - question: "Que es VRTon?"
        answer_html: "VRTon es una iniciativa voluntaria que une comunidades del metaverso de realidad virtual para lograr objetivos solidarios. Nos enfocamos en educacion, inspiracion, empatia y filantropia, usando la tecnologia para ayudar a otros y mejorar vidas."
      - question: "Como puedo asistir al evento?"
        answer_html: "El evento de este ano se realizara el <b>6 y 7 de noviembre</b>. Podes asistir uniendote a nuestro <a href='https://vrc.group/VRTON.0659'>grupo de VRChat</a>. El evento es completamente gratuito."
      - question: "Necesito equipo VR para participar?"
        answer_html: "No. Aunque un visor VR brinda la experiencia mas inmersiva, podes participar desde una computadora o incluso desde tu telefono."
      - question: "Como puedo ser voluntario?"
        answer_html: "Siempre estamos buscando personas apasionadas para sumarse al equipo. Hace click <a href='VOLUNTEERING_URL'>aca</a> para conocer mas sobre oportunidades de voluntariado."
    right:
      - question: "A donde va el dinero?"
        answer_html: "El 100% de los fondos recaudados va directamente a las organizaciones y causas aliadas. Promovemos las donaciones a traves de enlaces oficiales y no recaudamos dinero directamente."
      - question: "Que tipo de actividades habra en VRTon?"
        answer_html: "Vas a encontrar actividades para distintos intereses y edades, incluyendo conciertos y shows en vivo, talleres educativos, campanas de concientizacion y encuentros comunitarios."
      - question: "Como me mantengo al dia con los eventos?"
        answer_html: "Segui nuestras redes sociales (Discord, Instagram, X, TikTok, YouTube y Twitch) para enterarte de novedades, anuncios y contenido detras de escena."

legal:
  terms:
    title: "Terminos y Condiciones VRTon 2026"
    subtitle: "Normas y Politicas del Evento"
    sections:
      scope:
        title: "Terminos y Condiciones de VRTon 2026"
        subtitle: "1. Alcance"
        content: "Estos Terminos y Condiciones aplican al uso de todos los espacios y actividades relacionadas con VRTon, incluyendo el evento principal, el servidor de Discord, el grupo de VRChat, la pagina web oficial y las redes sociales. Se aplican antes, durante y despues del evento."
      compliance:
        title: "2. Cumplimiento de Normas Externas"
        intro: "Todos los participantes deben respetar los Terminos de Servicio y Normas de Comunidad de las plataformas utilizadas:"
        vrchat_tos: "Terminos de Servicio"
        vrchat_guidelines: "Normas de la Comunidad"
        discord_tos: "Terminos de Servicio"
        discord_guidelines: "Normas de la Comunidad"
      access:
        title: "3. Acceso y Elegibilidad"
        age: "El acceso al evento esta restringido a personas mayores de 18 anos, salvo en casos expresamente pre-aprobados por el equipo directivo y con autorizacion de un tutor legal."
        free: "La entrada al evento es gratuita."
        geographic: "No existen restricciones geograficas para participar."
        vr: "El acceso al evento en VRChat no requiere un headset de realidad virtual, aunque la plataforma puede imponer sus propias restricciones tecnicas o de acceso."
      intellectual:
        title: "4. Propiedad Intelectual y Voluntariado"
        ownership: "Todo el material oficial de VRTon (logotipos, disenos, textos, mundos, assets, presentaciones, graficos, etc.) es propiedad exclusiva de VRTon y no puede ser utilizado sin autorizacion expresa."
        volunteer: "Los puestos de voluntariado virtual en VRTon son de participacion libre y no tienen compensacion economica. Quienes deseen sumarse a estas actividades pueden hacerlo segun su disponibilidad y voluntad. Otros roles de trabajo remunerado, si existieran, se regiran por contratos y condiciones especificas acordadas por la organizacion."
        resources: "Todos los recursos creados para VRTon pueden ser utilizados sin restriccion en eventos actuales y futuros, incluso si el creador original deja el equipo."
      enforcement:
        title: "5. Aplicacion de las Normas y Sanciones"
        discretion: "La determinacion de que contenido cae en la categoria de apto o no apto para los eventos es discrecion unicamente del equipo de moderacion de VRTon."
        immediate: "El equipo de moderacion puede actuar de inmediato ante incumplimientos."
        explanation: "VRTon no esta obligada a dar explicaciones sobre sanciones aplicadas."
      liability:
        title: "6. Limitacion de Responsabilidad"
        technical: "VRTon no se hace responsable por problemas tecnicos, caidas de servidores, interrupciones de VRChat o Discord, ni por fallos de software o hardware de los participantes."
        conduct: "VRTon no se hace responsable por la conducta de los usuarios dentro o fuera de los espacios oficiales."
        asis: "Todo el contenido y los servicios se entregan \"tal cual\" (\"as is\"), sin garantia de funcionamiento o soporte futuro."
        acceptance: "La participacion implica aceptacion de estas condiciones y de las decisiones de moderacion."
        donations: "Todas las donaciones de VRTon 2026 se realizan por los medios oficiales de donacion proveidos por la organizacion benéfica seleccionada. VRTon no se hace responsable de ninguna transaccion realizada por medios no oficiales."
  code_of_conduct:
    title: "Codigo de Conducta VRTon 2026"
    subtitle: "Reglas y Normas del Evento"
    sections:
      introduction:
        title: "Codigo de Conducta de VRTon"
        content: "El Codigo de Conducta de VRTon busca asegurar un entorno seguro, inclusivo y respetuoso en todas nuestras instancias (VRChat, Discord, web y redes sociales)."
        moderation: "Si bien se detallan normas y ejemplos de comportamientos no permitidos, la determinacion final de que contenido o conducta se considera apta o inapropiada corresponde unicamente al equipo de moderacion y administracion de VRTon."
        scope: "Las siguientes normas aplican tanto a acciones y conductas como a contenido compartido en cualquier forma: avatares, imagenes de perfil, banners, emojis, stickers, items, sonidos, animaciones o cualquier otro recurso digital."
        compliance: "Asimismo, todos los participantes deben cumplir con los Terminos y Condiciones de VRTon, ademas de los Terminos de Servicio y Normas de las plataformas utilizadas."
      content_restrictions:
        title: "1. Restricciones de Contenido"
        sexual_title: "1.1 Contenido sexual o explicito"
        sexual_avatars: "Avatares desnudos, con genitales visibles o ropas excesivamente reveladoras."
        sexual_erp: "ERP, gestos, conversaciones o conductas sexuales o sugerentes."
        sexual_media: "Imagenes de perfil, banners, stickers o emojis con contenido NSFW."
        disturbing_title: "1.2 Contenido perturbador"
        disturbing_gore: "Gore, violencia grafica o terror extremo."
        disturbing_self_harm: "Apologia del suicidio o la autolesion."
        disruptive_title: "1.3 Contenido disruptivo o troll"
        disruptive_avatars: "Avatares con sonidos excesivos, particulas invasivas o shaders que dificulten la experiencia de los demas."
        disruptive_behavior: "Actitudes destinadas a molestar, interrumpir o sabotear actividades."
        harmful_title: "1.4 Discurso danino"
        harmful_hate: "Expresiones de odio, racismo, xenofobia, homofobia, transfobia, sexismo o cualquier forma de discriminacion."
        harmful_politics: "Conversaciones de caracter politico o religioso."
        harmful_attacks: "Comentarios que busquen desestimar o atacar a VRTon, la organizacion benéfica seleccionada, comunidades asociadas o participantes."
      prohibited_actions:
        title: "2. Acciones Prohibidas"
        intro: "Ademas del contenido, se prohiben las siguientes conductas en todos los espacios de VRTon:"
        spam_title: "2.1 Spam y publicidad no autorizada"
        spam_commercial: "Enviar enlaces a paginas de compra/venta, concursos, recaudaciones o similares sin aprobacion del staff."
        spam_invites: "Compartir invitaciones a otros servidores de Discord, redes sociales o comunidades externas sin autorizacion."
        spam_portals: "Abrir \"portales\" hacia otras instancias en VRChat con fines de desvio de usuarios."
        spam_events: "Spam de invitaciones a grupos, eventos o instancias ajenas a VRTon."
        impersonation_title: "2.2 Suplantacion de identidad"
        impersonation_users: "Hacerse pasar por otros usuarios u organizaciones."
        impersonation_staff: "Fingir ser parte del staff o del voluntariado virtual de VRTon."
        information_title: "2.3 Divulgacion de informacion"
        information_personal: "Compartir informacion personal (propia o ajena) sin consentimiento."
        information_false: "Difundir informacion falsa, rumores o desinformacion con intencion de dañar."
        illegal_title: "2.4 Actividades ilegales"
        illegal_fraud: "Estafas, enganos o intentos de fraude."
        illegal_piracy: "Distribucion o promocion de contenido obtenido de forma ilegal (\"ripeo\" de assets, avatares, mundos u otros recursos)."
        illegal_other: "Cualquier otra actividad ilicita que infrinja leyes locales o internacionales."
        harassment_title: "2.5 Conductas de acoso o violencia"
        harassment_general: "Acoso, amenazas, hostigamiento o persecucion hacia cualquier persona."
        harassment_intimidation: "Intimidacion verbal, gestual o mediante avatares/animaciones."
        disruption_title: "2.6 Interrupcion de actividades"
        disruption_events: "Molestar deliberadamente durante presentaciones, shows, charlas o actividades comunitarias."
        disruption_audio: "Gritos, spam de voz, sonidos repetitivos o invasivos."
        disruption_avatars: "Uso de avatares ofensivos, molestos o con efectos destinados a interrumpir."
        disruption_exploits: "Uso de clientes modificados u otro recurso destinado a explotar los sistemas del evento para beneficio propio o disrupcion de la experiencia de los demas."
  volunteering:
    title: "Terminos de Voluntariado y Colaboracion VRTon 2026"
    subtitle: "Conoce las condiciones para formar parte del equipo VRTon"
    sections:
      intro:
        title: "Terminos del Voluntariado en VRTon"
        content: "El objetivo de estos terminos es establecer un marco claro y transparente para quienes deseen colaborar, ya sea de forma individual o en representacion de comunidades."
      general:
        title: "1. Disposiciones Generales"
        nature_title: "1.1. Naturaleza del voluntariado"
        nature_content1: "Todos los puestos de trabajo en VRTon son de caracter voluntario y no implican compensacion economica."
        nature_content2: "La participacion es libre y cada persona o comunidad podra colaborar en la medida de sus posibilidades y disponibilidad."
        recognition_title: "1.2. Reconocimiento y limites"
        recognition_content1: "Se otorgaran los creditos correspondientes a toda persona o comunidad que realice aportes, independientemente de su magnitud."
        recognition_content2: "No esta permitido utilizar la condicion de voluntario o de comunidad colaboradora como medio de autopromocion personal o de proyectos externos no relacionados con VRTon."
        ownership_title: "1.3. Propiedad de recursos creados"
        ownership_content: "Todos los recursos creados para VRTon (incluyendo assets, mundos, graficos, comisiones, presentaciones u otros) podran ser utilizados sin restriccion en eventos actuales y futuros, incluso si el creador o la comunidad responsable deja de formar parte del proyecto."
        communication_title: "1.4. Comunicacion oficial"
        communication_content1: "El servidor de Discord de VRTon sera el principal medio de comunicacion."
        communication_content2: "Se espera que los voluntarios revisen con frecuencia los canales asignados para estar al tanto de novedades, tareas y responsabilidades."
        sanctions_title: "1.5. Sanciones"
        sanctions_content: "VRTon se reserva el derecho de remover usuarios o comunidades que se mantengan inactivos o que incumplan los presentes terminos, el Codigo de Conducta o los Terminos y Condiciones de VRTon."
      individual:
        title: "2. Voluntariado Individual"
        teams_title: "2.1. Equipos de trabajo"
        teams_content1: "El voluntariado individual se integra directamente en los equipos de trabajo oficiales de VRTon, los cuales pueden consultarse en la pagina de colaboradores: vrton.org/colaboradores."
        teams_content2: "Cada voluntario podra sumarse al equipo que mejor se ajuste a sus habilidades e intereses, en coordinacion con la organizacion."
        teams_content3: "Se procurara que cada voluntario participe en un maximo de dos equipos de trabajo simultaneamente, aunque podran hacerse excepciones en casos justificados."
        commitment_title: "2.2. Compromiso esperado"
        commitment_content1: "Cumplir con las responsabilidades asumidas en la medida de sus posibilidades."
        commitment_content2: "Mantener una comunicacion abierta y respetuosa con los equipos de trabajo."
        commitment_content3: "Notificar por los canales correspondientes en caso de ausentarse o no poder cumplir con los plazos estipulados."
        leadership_title: "2.3. Estructura de liderazgo"
        leadership_content1: "Cada equipo contara con un lider designado directamente por el equipo directivo de VRTon, quien sera el principal punto de contacto ante cualquier situacion."
        leadership_content2: "Si el problema involucra al propio lider, los voluntarios deberan comunicarse directamente con el equipo directivo de VRTon."
        leadership_content3: "Cada persona podra liderar un solo equipo a la vez, sin excepciones."
      community:
        title: "3. Voluntariado por Comunidades"
        modalities_title: "3.1. Modalidades de participacion"
        modalities_intro: "Las comunidades que deseen colaborar con VRTon pueden hacerlo a traves de:"
        modalities_activities: "Organizacion de actividades: coordinar y realizar una actividad dentro del evento principal."
        modalities_donations: "Colectas y donaciones: organizar recaudaciones internas y presentar la donacion grupal durante el evento."
        modalities_creative: "Aportes creativos: donar assets, comisiones, u otros elementos para la Rifa Solidaria o actividades relacionadas."
        modalities_outreach: "Difusion: ayudar a publicitar la VRTon y tender puentes con mas usuarios y comunidades."
        modalities_other: "Otras iniciativas: proponer formas alternativas de colaboracion no contempladas en estos terminos, previa aprobacion del equipo de VRTon."
        responsibilities_title: "3.2. Responsabilidades de las comunidades voluntarias"
        responsibilities_content1: "Designar al menos un representante oficial para mantener comunicacion con el staff de VRTon."
        responsibilities_content2: "Cumplir con los plazos y requisitos acordados para las actividades o aportes propuestos."
        responsibilities_content3: "Garantizar que sus aportes respeten los Terminos y Condiciones, el Codigo de Conducta y las leyes aplicables."


  faq:
    title: "Preguntas Frecuentes"
    left:
      - question: "¿Qué es VRTon?"
        answer_html: "VRTon es una iniciativa voluntaria que une comunidades del metaverso de realidad virtual para lograr objetivos solidarios. Nos enfocamos en educación, inspiración, empatía y filantropía, usando la tecnología para ayudar a otros y mejorar vidas."
      - question: "¿Cómo puedo asistir al evento?"
        answer_html: "El evento de este año se realizará el <b>6 y 7 de noviembre</b>. Podés asistir uniéndote a nuestro <a href='https://vrc.group/VRTON.0659'>grupo de VRChat</a>. El evento es completamente gratuito."
      - question: "¿Necesito equipo VR para participar?"
        answer_html: "No. Aunque un visor VR brinda la experiencia más inmersiva, podés participar desde una computadora o incluso desde tu teléfono."
      - question: "¿Cómo puedo ser voluntario?"
        answer_html: "Siempre estamos buscando personas apasionadas para sumarse al equipo. Hacé clic <a href='VOLUNTEERING_URL'>aqui</a> para conocer más sobre oportunidades de voluntariado."
    right:
      - question: "¿A dónde va el dinero?"
        answer_html: "El 100% de los fondos recaudados va directamente a las organizaciones y causas aliadas. Promovemos las donaciones a través de enlaces oficiales y no recaudamos dinero directamente."
      - question: "¿Qué tipo de actividades habrá en VRTon?"
        answer_html: "Vas a encontrar actividades para distintos intereses y edades, incluyendo conciertos y shows en vivo, talleres educativos, campañas de concientización y encuentros comunitarios."
      - question: "¿Cómo me mantengo al día con los eventos?"
        answer_html: "Seguí nuestras redes sociales (Discord, Instagram, X, TikTok, YouTube y Twitch) para enterarte de novedades, anuncios y contenido detrás de escena."

legal:
  terms:
    title: "Términos y Condiciones VRTon 2026"
    subtitle: "Normas y Políticas del Evento"
    sections:
      scope:
        title: "Términos y Condiciones de VRTon 2026"
        subtitle: "1. Alcance"
        content: "Estos Términos y Condiciones aplican al uso de todos los espacios y actividades relacionadas con VRTon, incluyendo el evento principal, el servidor de Discord, el grupo de VRChat, la página web oficial y las redes sociales. Se aplican antes, durante y después del evento."
      compliance:
        title: "2. Cumplimiento de Normas Externas"
        intro: "Todos los participantes deben respetar los Términos de Servicio y Normas de Comunidad de las plataformas utilizadas:"
        vrchat_tos: "Términos de Servicio"
        vrchat_guidelines: "Normas de la Comunidad"
        discord_tos: "Términos de Servicio"
        discord_guidelines: "Normas de la Comunidad"
      access:
        title: "3. Acceso y Elegibilidad"
        age: "El acceso al evento está restringido a personas mayores de 18 años, salvo en casos expresamente preaprobados por el equipo directivo y con autorización de un tutor legal."
        free: "La entrada al evento es gratuita."
        geographic: "No existen restricciones geográficas para participar."
        vr: "El acceso al evento en VRChat no requiere un headset de realidad virtual, aunque la plataforma puede imponer sus propias restricciones técnicas o de acceso."
      intellectual:
        title: "4. Propiedad Intelectual y Voluntariado"
        ownership: "Todo el material oficial de VRTon (logotipos, diseños, textos, mundos, assets, presentaciones, gráficos, etc.) es propiedad exclusiva de VRTon y no puede ser utilizado sin autorización expresa."
        volunteer: "Los puestos de voluntariado virtual en VRTon son de participación libre y no tienen compensación económica. Quienes deseen sumarse a estas actividades pueden hacerlo según su disponibilidad y voluntad. Otros roles de trabajo remunerado, si existieran, se regirán por contratos y condiciones específicas acordadas por la organización."
        resources: "Todos los recursos creados para VRTon pueden ser utilizados sin restricción en eventos actuales y futuros, incluso si el creador original deja el equipo."
      enforcement:
        title: "5. Aplicación de las Normas y Sanciones"
        discretion: "La determinación de qué contenido cae en la categoría de apto o no apto para los eventos es discreción únicamente del equipo de moderación de VRTon."
        immediate: "El equipo de moderación puede actuar de inmediato ante incumplimientos."
        explanation: "VRTon no está obligada a dar explicaciones sobre sanciones aplicadas."
      liability:
        title: "6. Limitación de Responsabilidad"
        technical: "VRTon no se hace responsable por problemas técnicos, caídas de servidores, interrupciones de VRChat o Discord, ni por fallos de software o hardware de los participantes."
        conduct: "VRTon no se hace responsable por la conducta de los usuarios dentro o fuera de los espacios oficiales."
        asis: "Todo el contenido y los servicios se entregan \"tal cual\" (\"as is\"), sin garantía de funcionamiento o soporte futuro."
        acceptance: "La participación implica aceptación de estas condiciones y de las decisiones de moderación."
        donations: "Todas las donaciones de VRTon 2026 se realizan por los medios oficiales de donación proveídos por la organización benéfica seleccionada. VRTon no se hace responsable de ninguna transacción realizada por medios no oficiales."
  code_of_conduct:
    title: "Código de Conducta VRTon 2026"
    subtitle: "Reglas y Normas del Evento"
    sections:
      introduction:
        title: "Código de Conducta de VRTon"
        content: "El Código de Conducta de VRTon busca asegurar un entorno seguro, inclusivo y respetuoso en todas nuestras instancias (VRChat, Discord, web y redes sociales)."
        moderation: "Si bien se detallan normas y ejemplos de comportamientos no permitidos, la determinación final de qué contenido o conducta se considera apta o inapropiada corresponde únicamente al equipo de moderación y administración de VRTon."
        scope: "Las siguientes normas aplican tanto a acciones y conductas como a contenido compartido en cualquier forma: avatares, imágenes de perfil, banners, emojis, stickers, ítems, sonidos, animaciones o cualquier otro recurso digital."
        compliance: "Asimismo, todos los participantes deben cumplir con los Términos y Condiciones de VRTon, además de los Términos de Servicio y Normas de las plataformas utilizadas."
      content_restrictions:
        title: "1. Restricciones de Contenido"
        sexual_title: "1.1 Contenido sexual o explícito"
        sexual_avatars: "Avatares desnudos, con genitales visibles o ropas excesivamente reveladoras."
        sexual_erp: "ERP, gestos, conversaciones o conductas sexuales o sugerentes."
        sexual_media: "Imágenes de perfil, banners, stickers o emojis con contenido NSFW."
        disturbing_title: "1.2 Contenido perturbador"
        disturbing_gore: "Gore, violencia gráfica o terror extremo."
        disturbing_self_harm: "Apología del suicidio o la autolesión."
        disruptive_title: "1.3 Contenido disruptivo o troll"
        disruptive_avatars: "Avatares con sonidos excesivos, partículas invasivas o shaders que dificulten la experiencia de los demás."
        disruptive_behavior: "Actitudes destinadas a molestar, interrumpir o sabotear actividades."
        harmful_title: "1.4 Discurso dañino"
        harmful_hate: "Expresiones de odio, racismo, xenofobia, homofobia, transfobia, sexismo o cualquier forma de discriminación."
        harmful_politics: "Conversaciones de carácter político o religioso."
        harmful_attacks: "Comentarios que busquen desestimar o atacar a VRTon, la organización benéfica seleccionada, comunidades asociadas o participantes."
      prohibited_actions:
        title: "2. Acciones Prohibidas"
        intro: "Además del contenido, se prohíben las siguientes conductas en todos los espacios de VRTon:"
        spam_title: "2.1 Spam y publicidad no autorizada"
        spam_commercial: "Enviar enlaces a páginas de compra/venta, concursos, recaudaciones o similares sin aprobación del staff."
        spam_invites: "Compartir invitaciones a otros servidores de Discord, redes sociales o comunidades externas sin autorización."
        spam_portals: "Abrir \"portales\" hacia otras instancias en VRChat con fines de desvío de usuarios."
        spam_events: "Spam de invitaciones a grupos, eventos o instancias ajenas a VRTon."
        impersonation_title: "2.2 Suplantación de identidad"
        impersonation_users: "Hacerse pasar por otros usuarios u organizaciones."
        impersonation_staff: "Fingir ser parte del staff o del voluntariado virtual de VRTon."
        information_title: "2.3 Divulgación de información"
        information_personal: "Compartir información personal (propia o ajena) sin consentimiento."
        information_false: "Difundir información falsa, rumores o desinformación con intención de dañar."
        illegal_title: "2.4 Actividades ilegales"
        illegal_fraud: "Estafas, engaños o intentos de fraude."
        illegal_piracy: "Distribución o promoción de contenido obtenido de forma ilegal (\"ripeo\" de assets, avatares, mundos u otros recursos)."
        illegal_other: "Cualquier otra actividad ilícita que infrinja leyes locales o internacionales."
        harassment_title: "2.5 Conductas de acoso o violencia"
        harassment_general: "Acoso, amenazas, hostigamiento o persecución hacia cualquier persona."
        harassment_intimidation: "Intimidación verbal, gestual o mediante avatares/animaciones."
        disruption_title: "2.6 Interrupción de actividades"
        disruption_events: "Molestar deliberadamente durante presentaciones, shows, charlas o actividades comunitarias."
        disruption_audio: "Gritos, spam de voz, sonidos repetitivos o invasivos."
        disruption_avatars: "Uso de avatares ofensivos, molestos o con efectos destinados a interrumpir."
        disruption_exploits: "Uso de clientes modificados u otro recurso destinado a explotar los sistemas del evento para beneficio propio o disrupción de la experiencia de los demás."
  volunteering:
    title: "Términos de Voluntariado y Colaboración VRTon 2026"
    subtitle: "Conocé las condiciones para formar parte del equipo VRTon"
    sections:
      intro:
        title: "Términos del Voluntariado en VRTon"
        content: "El objetivo de estos términos es establecer un marco claro y transparente para quienes deseen colaborar, ya sea de forma individual o en representación de comunidades."
      general:
        title: "1. Disposiciones Generales"
        nature_title: "1.1. Naturaleza del voluntariado"
        nature_content1: "Todos los puestos de trabajo en VRTon son de carácter voluntario y no implican compensación económica."
        nature_content2: "La participación es libre y cada persona o comunidad podrá colaborar en la medida de sus posibilidades y disponibilidad."
        recognition_title: "1.2. Reconocimiento y límites"
        recognition_content1: "Se otorgarán los créditos correspondientes a toda persona o comunidad que realice aportes, independientemente de su magnitud."
        recognition_content2: "No está permitido utilizar la condición de voluntario o de comunidad colaboradora como medio de autopromoción personal o de proyectos externos no relacionados con VRTon."
        ownership_title: "1.3. Propiedad de recursos creados"
        ownership_content: "Todos los recursos creados para VRTon (incluyendo assets, mundos, gráficos, comisiones, presentaciones u otros) podrán ser utilizados sin restricción en eventos actuales y futuros, incluso si el creador o la comunidad responsable deja de formar parte del proyecto."
        communication_title: "1.4. Comunicación oficial"
        communication_content1: "El servidor de Discord de VRTon será el principal medio de comunicación."
        communication_content2: "Se espera que los voluntarios revisen con frecuencia los canales asignados para estar al tanto de novedades, tareas y responsabilidades."
        sanctions_title: "1.5. Sanciones"
        sanctions_content: "VRTon se reserva el derecho de remover usuarios o comunidades que se mantengan inactivos o que incumplan los presentes términos, el Código de Conducta o los Términos y Condiciones de VRTon."
      individual:
        title: "2. Voluntariado Individual"
        teams_title: "2.1. Equipos de trabajo"
        teams_content1: "El voluntariado individual se integra directamente en los equipos de trabajo oficiales de VRTon, los cuales pueden consultarse en la página de colaboradores: vrton.org/colaboradores."
        teams_content2: "Cada voluntario podrá sumarse al equipo que mejor se ajuste a sus habilidades e intereses, en coordinación con la organización."
        teams_content3: "Se procurará que cada voluntario participe en un máximo de dos equipos de trabajo simultáneamente, aunque podrán hacerse excepciones en casos justificados."
        commitment_title: "2.2. Compromiso esperado"
        commitment_content1: "Cumplir con las responsabilidades asumidas en la medida de sus posibilidades."
        commitment_content2: "Mantener una comunicación abierta y respetuosa con los equipos de trabajo."
        commitment_content3: "Notificar por los canales correspondientes en caso de ausentarse o no poder cumplir con los plazos estipulados."
        leadership_title: "2.3. Estructura de liderazgo"
        leadership_content1: "Cada equipo contará con un líder designado directamente por el equipo directivo de VRTon, quien será el principal punto de contacto ante cualquier situación."
        leadership_content2: "Si el problema involucra al propio líder, los voluntarios deberán comunicarse directamente con el equipo directivo de VRTon."
        leadership_content3: "Cada persona podrá liderar un solo equipo a la vez, sin excepciones."
      community:
        title: "3. Voluntariado por Comunidades"
        modalities_title: "3.1. Modalidades de participación"
        modalities_intro: "Las comunidades que deseen colaborar con VRTon pueden hacerlo a través de:"
        modalities_activities: "Organización de actividades: coordinar y realizar una actividad dentro del evento principal."
        modalities_donations: "Colectas y donaciones: organizar recaudaciones internas y presentar la donación grupal durante el evento."
        modalities_creative: "Aportes creativos: donar assets, comisiones, u otros elementos para la Rifa Solidaria o actividades relacionadas."
        modalities_outreach: "Difusión: ayudar a publicitar la VRTon y tender puentes con más usuarios y comunidades."
        modalities_other: "Otras iniciativas: proponer formas alternativas de colaboración no contempladas en estos términos, previa aprobación del equipo de VRTon."
        responsibilities_title: "3.2. Responsabilidades de las comunidades voluntarias"
        responsibilities_content1: "Designar al menos un representante oficial para mantener comunicación con el staff de VRTon."
        responsibilities_content2: "Cumplir con los plazos y requisitos acordados para las actividades o aportes propuestos."
        responsibilities_content3: "Garantizar que sus aportes respeten los Términos y Condiciones, el Código de Conducta y las leyes aplicables."

